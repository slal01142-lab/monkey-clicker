name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: |
          unzip -o MonkeyHopClicker.zip -d src
          ROOT="$(dirname "$(find src -name 'settings.gradle*' | head -1)")"
          cd "$ROOT"
          if [ -f app/build.gradle.kts ]; then
            sed -i '0,/defaultConfig {/s//defaultConfig {\n        applicationIdSuffix = ".v2"\n        ndk { abiFilters += listOf("arm64-v8a") }/' app/build.gradle.kts
          else
            sed -i '0,/defaultConfig {/s//defaultConfig {\n        applicationIdSuffix ".v2"\n        ndk { abiFilters "arm64-v8a" }/' app/build.gradle
          fi
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MonkeyHopClicker-apk
          path: src/**/build/outputs/apk/debug/*.apk
