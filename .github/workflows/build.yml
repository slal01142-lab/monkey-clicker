          import kotlin.math.min

          class ClickerService : AccessibilityService() {
              companion object {
                  const val TAG = "Clicker"
                  const val GAME_PACKAGE = "com.your.game"      // <-- APNI GAME KA PACKAGE NAME DAALO
                  val AD_HINTS = listOf("AdActivity", "ads", "applovin", "unity3d", "ironsource", "vungle", "inmobi", "mbridge", "pangle")
                  val REWARD_TEXTS = listOf("Reward granted", "Reward earned")
                  @Volatile var running = false
              }

              private val scope = CoroutineScope(Dispatchers.Default + SupervisorJob())
              @Volatile private var adActive = false
              private var adSince = 0L
              private var lastTap = 0L
              private var cornerTry = 0
              @Volatile private var gesturing = false
              private fun now() = System.currentTimeMillis()

              override fun onServiceConnected() { scope.launch { loop() } }
              override fun onInterrupt() {}
              override fun onDestroy() { scope.cancel(); super.onDestroy() }

              override fun onAccessibilityEvent(e: AccessibilityEvent) {
                  if (e.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
                  val cls = e.className?.toString() ?: return
                  Log.d(TAG, "window: ${e.packageName} / $cls")   // logcat dekh ke AD_HINTS tune karo
                  val isAd = AD_HINTS.any { cls.contains(it, true) }
                  if (isAd && !adActive) { adActive = true; adSince = now(); cornerTry = 0 }
                  else if (!isAd && adActive && e.packageName == GAME_PACKAGE && !cls.startsWith("android.")) adActive = false
              }

              private suspend fun loop() {
                  while (scope.isActive) {
                      delay(if (adActive) 500 else 70)
                      if (!running) continue
                      try { step() } catch (e: Exception) { Log.e(TAG, "step", e) }
                  }
              }

              private fun step() {
                  if (adActive && now() - adSince > 90_000) adActive = false   // safety
                  if (adActive) { handleAd(); return }
                  if (rootInActiveWindow?.packageName != GAME_PACKAGE) return
                  val bmp = Frames.latest ?: return
                  val s = Vision.analyze(bmp)
                  if (s.popup) handlePopup(s) else playGame(s)
              }

              // ---------- POPUPS: Claim / Try Again / Continue ----------
              private fun handlePopup(s: Scene) {
                  if (now() - lastTap < 1500) return
                  val root = rootInActiveWindow
                  // exact text match: "Claimed" ko "Claim" na samjhe. Cancel/Quit/No Thanks kabhi nahi.
                  var done = root != null && listOf("Claim", "Try Again", "Continue").any { clickByText(root, it) }
                  if (!done && s.greenBtn) { tapFrac(0.69f, 0.60f); done = true }
                  if (done) lastTap = now()
              }

              // ---------- AD: reward ke baad sirf X ----------
              private fun handleAd() {
                  val root = rootInActiveWindow
                  val rewardDone = root != null && REWARD_TEXTS.any { root.findAccessibilityNodeInfosByText(it).isNotEmpty() }
                  if (!rewardDone && now() - adSince < 45_000) return     // countdown chal raha hai
                  if (now() - lastTap < 2000) return
                  lastTap = now()
                  if (root != null && clickCloseNode(root)) return
                  when (cornerTry++ % 3) {                                // fallback: sirf upar ke corners ya Back
                      0 -> tapFrac(0.94f, 0.07f)
                      1 -> tapFrac(0.06f, 0.07f)
                      else -> performGlobalAction(GLOBAL_ACTION_BACK)
                  }
              }

              // ---------- GAME ----------
              private fun playGame(s: Scene) {
                  if (gesturing) return
                  val mx = s.monkeyX ?: return
                  val tx = decide(s, mx) ?: return
                  if (abs(tx - mx) < 0.03f) return
                  swipe(mx, tx)
              }

              private fun decide(s: Scene, mx: Float): Float? {
                  val safeW = 0.13f
                  fun threatened(x: Float) = s.bombs.any { abs(it.x - x) < safeW && it.y > 0.25f }
                  fun blocked(a: Float, b: Float): Boolean {
                      val lo = min(a, b) - safeW * 0.8f; val hi = max(a, b) + safeW * 0.8f
                      return s.bombs.any { it.x in lo..hi && it.y > 0.55f }
                  }
                  // sabse neeche (monkey ke paas) wala safe fruit
                  for (f in s.fruits.sortedByDescending { it.y })
                      if (!threatened(f.x) && !blocked(mx, f.x)) return f.x
                  // koi safe fruit nahi: bomb se door raho
                  if (!threatened(mx)) return mx
