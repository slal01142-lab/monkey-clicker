name: B
on: [push, workflow_dispatch]
env:
  P: com.your.game
jobs:
 b:
  runs-on: ubuntu-latest
  steps:
  - uses: actions/setup-java@v4
    with: {distribution: temurin, java-version: 17}
  - uses: gradle/actions/setup-gradle@v4
    with: {gradle-version: 8.7}
  - run: |
     mkdir -p src/main/res/xml src/main/java
     cat > settings.gradle.kts <<'E'
     pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}}
     dependencyResolutionManagement{repositories{google();mavenCentral()}}
     E
     cat > build.gradle.kts <<'E'
     plugins{id("com.android.application") version "8.5.0";id("org.jetbrains.kotlin.android") version "1.9.24"}
     android{namespace="x.bot";compileSdk=34;defaultConfig{minSdk=30;targetSdk=34}
     compileOptions{sourceCompatibility=JavaVersion.VERSION_17;targetCompatibility=JavaVersion.VERSION_17}
     kotlinOptions{jvmTarget="17"}}
     dependencies{implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")}
     E
     cat > src/main/AndroidManifest.xml <<'E'
     <manifest xmlns:android="http://schemas.android.com/apk/res/android">
     <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
     <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>
     <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
     <application android:label="Bot">
     <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
     <service android:name=".CS" android:foregroundServiceType="mediaProjection"/>
     <service android:name=".Bot" android:exported="true" android:label="Bot" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"><intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter><meta-data android:name="android.accessibilityservice" android:resource="@xml/c"/></service>
     </application>
     </manifest>
     E
     cat > src/main/res/xml/c.xml <<'E'
     <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android" android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged" android:accessibilityFeedbackType="feedbackGeneric" android:canPerformGestures="true" android:canRetrieveWindowContent="true" android:accessibilityFlags="flagReportViewIds" android:notificationTimeout="100"/>
     E
     cat > src/main/java/A.kt <<'E'
     package x.bot
     import android.accessibilityservice.*
     import android.app.*
     import android.content.Intent
     import android.content.pm.ServiceInfo
     import android.graphics.*
     import android.hardware.display.DisplayManager
     import android.media.ImageReader
     import android.media.projection.*
     import android.os.*
     import android.provider.Settings
     import android.util.*
     import android.view.accessibility.*
     import android.widget.*
     import kotlinx.coroutines.*
     import kotlin.math.*

     class S(val mx: Float?, val fr: List<Pair<Float, Float>>, val bo: List<Pair<Float, Float>>, val pop: Boolean, val gr: Boolean)

     object F {
      @Volatile var b: Bitmap? = null
      @Volatile var w = 1080
      @Volatile var h = 2400
     }

     object V {
      fun an(b: Bitmap): S {
       val w = b.width; val h = b.height
       val p = IntArray(w * h)
       b.getPixels(p, 0, w, 0, 0, w, h)
       var sm = 0
       for (fy in floatArrayOf(.2f, .3f)) for (fx in floatArrayOf(.2f, .5f, .8f)) {
        val c = p[(fy * h).toInt() * w + (fx * w).toInt()]
        sm += (((c shr 16) and 255) * 3 + ((c shr 8) and 255) * 6 + (c and 255)) / 10
       }
       val c0 = p[(.6f * h).toInt() * w + (.69f * w).toInt()]
       val r0 = (c0 shr 16) and 255; val g0 = (c0 shr 8) and 255; val b0 = c0 and 255
       val gr = g0 > 140 && g0 > r0 + 50 && g0 > b0 + 20 && r0 < 120
       if (sm / 6 < 95) return S(null, listOf(), listOf(), true, gr)
       val m = ByteArray(w * h)
       var sx = 0L; var n = 0
       for (y in (.15f * h).toInt() until (.95f * h).toInt()) for (x in 0 until w) {
        val c = p[y * w + x]
        val r = (c shr 16) and 255; val g = (c shr 8) and 255; val bb = c and 255
        if (y < .92f * h) m[y * w + x] = when {
         r < 75 && g < 75 && bb < 80 && abs(r - g) < 18 && abs(g - bb) < 25 -> 2
         r > 190 && g < 100 && bb < 90 -> 1
         r > 230 && g in 110..175 && bb < 70 -> 1
         else -> 0
        }
        if (y > .65f * h && r > 230 && g > 185 && bb < 80) { sx += x; n++ }
       }
       return S(if (n > 40) sx.toFloat() / n / w else null, bl(m, 1, w, h).filter { it.second < .78f }, bl(m, 2, w, h), false, gr)
      }

      fun bl(m: ByteArray, k: Byte, w: Int, h: Int): List<Pair<Float, Float>> {
       val s = BooleanArray(w * h); val st = IntArray(w * h)
       val o = ArrayList<Pair<Float, Float>>()
       val ds = intArrayOf(-1, 1, -w, w)
       for (i in m.indices) {
        if (m[i] != k || s[i]) continue
        var sp = 0; st[sp++] = i; s[i] = true
        var a = 0; var sx = 0L; var sy = 0L
        while (sp > 0) {
         val q = st[--sp]; val x = q % w; val y = q / w
         a++; sx += x; sy += y
         for (d in ds) {
          val t = q + d
          if (t < 0 || t >= w * h || (d == -1 && x == 0) || (d == 1 && x == w - 1) || m[t] != k || s[t]) continue
          s[t] = true; st[sp++] = t
         }
        }
        if (a >= 120) o += Pair(sx.toFloat() / a / w, sy.toFloat() / a / h)
       }
       return o
      }
     }

     class CS : Service() {
      override fun onBind(i: Intent?): IBinder? = null
      override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
       getSystemService(NotificationManager::class.java).createNotificationChannel(NotificationChannel("c", "c", 2))
       startForeground(1, Notification.Builder(this, "c").setContentTitle("Bot").setSmallIcon(android.R.drawable.ic_menu_camera).build(), ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
       val d = i?.getParcelableExtra<Intent>("d") ?: return START_NOT_STICKY
       val mp = getSystemService(MediaProjectionManager::class.java).getMediaProjection(i.getIntExtra("c", 0), d)
       mp.registerCallback(object : MediaProjection.Callback() {}, Handler(Looper.getMainLooper()))
       val dm = DisplayMetrics()
       getSystemService(DisplayManager::class.java).getDisplay(0).getRealMetrics(dm)
       F.w = dm.widthPixels; F.h = dm.heightPixels
       val w = F.w / 4; val h = F.h / 4
       val ir = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 2)
       mp.createVirtualDisplay("c", w, h, dm.densityDpi, 16, ir.surface, null, null)
       ir.setOnImageAvailableListener({ r ->
        val im = r.acquireLatestImage() ?: return@setOnImageAvailableListener
        try {
         val pl = im.planes[0]
         val pad = (pl.rowStride - pl.pixelStride * w) / pl.pixelStride
         val bm = Bitmap.createBitmap(w + pad, h, Bitmap.Config.ARGB_8888)
         bm.copyPixelsFromBuffer(pl.buffer)
         F.b = if (pad == 0) bm else Bitmap.createBitmap(bm, 0, 0, w, h)
        } finally { im.close() }
       }, Handler(HandlerThread("c").apply { start() }.looper))
       return START_NOT_STICKY
      }
     }

     class MainActivity : Activity() {
      override fun onCreate(b: Bundle?) {
       super.onCreate(b)
       val l = LinearLayout(this).apply { orientation = 1; setPadding(48, 96, 48, 48) }
       fun bt(t: String, f: () -> Unit) = l.addView(Button(this).apply { text = t; setOnClickListener { f() } })
       bt("1. Accessibility ON") { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
       bt("2. Capture allow") { startActivityForResult(getSystemService(MediaProjectionManager::class.java).createScreenCaptureIntent(), 1) }
       bt("3. START") { Bot.on = true }
       bt("STOP") { Bot.on = false }
       setContentView(l)
      }
      override fun onActivityResult(r: Int, c: Int, d: Intent?) {
       if (r == 1 && c == RESULT_OK && d != null) startForegroundService(Intent(this, CS::class.java).putExtra("c", c).putExtra("d", d))
      }
     }

     class Bot : AccessibilityService() {
      companion object {
       const val PK = "com.your.game"
       @Volatile var on = false
      }
      val sc = CoroutineScope(Dispatchers.Default)
      @Volatile var ad = false
      @Volatile var gs = false
      var adT = 0L; var lt = 0L; var ct = 0
      fun now() = System.currentTimeMillis()

      override fun onServiceConnected() {
       sc.launch {
        while (isActive) {
         delay(if (ad) 500 else 70)
         if (on) try { step() } catch (e: Exception) { Log.e("Bot", "x", e) }
        }
       }
      }
      override fun onInterrupt() {}
      override fun onAccessibilityEvent(e: AccessibilityEvent) {
       if (e.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
       val c = e.className?.toString() ?: return
       Log.d("Bot", "${e.packageName}/$c")
       val a = listOf("AdActivity", "ads", "applovin", "unity3d", "ironsource", "vungle", "inmobi", "mbridge", "pangle").any { c.contains(it, true) }
       if (a && !ad) { ad = true; adT = now(); ct = 0 }
       else if (!a && ad && e.packageName == PK && !c.startsWith("android.")) ad = false
      }

      fun step() {
       if (ad && now() - adT > 90000) ad = false
       if (ad) { handleAd(); return }
       if (rootInActiveWindow?.packageName != PK) return
       val s = V.an(F.b ?: return)
       if (s.pop) pop(s) else play(s)
      }

      fun pop(s: S) {
       if (now() - lt < 1500) return
       val r = rootInActiveWindow
       var d = r != null && listOf("Claim", "Try Again", "Continue").any { ck(r, it) }
       if (!d && s.gr) { tap(.69f, .6f); d = true }
       if (d) lt = now()
      }

      fun handleAd() {
       val r = rootInActiveWindow
       val ok = r != null && listOf("Reward granted", "Reward earned").any { r.findAccessibilityNodeInfosByText(it).isNotEmpty() }
       if (!ok && now() - adT < 45000) return
       if (now() - lt < 2000) return
       lt = now()
       if (r != null && cl(r, 0)) return
       when (ct++ % 3) {
        0 -> tap(.94f, .07f)
        1 -> tap(.06f, .07f)
        else -> performGlobalAction(GLOBAL_ACTION_BACK)
       }
      }

      fun play(s: S) {
       if (gs) return
       val m = s.mx ?: return
       val t = dec(s, m) ?: return
       if (abs(t - m) < .03f) return
       val p = Path().apply { moveTo(m * F.w, .88f * F.h); lineTo(t * F.w, .88f * F.h) }
       gs = true
       val cb = object : GestureResultCallback() {
        override fun onCompleted(g: GestureDescription?) { gs = false }
        override fun onCancelled(g: GestureDescription?) { gs = false }
       }
       dispatchGesture(GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(p, 0, 90)).build(), cb, null)
      }

      fun dec(s: S, m: Float): Float? {
       val w = .13f
       fun th(x: Float) = s.bo.any { abs(it.first - x) < w && it.second > .25f }
       fun bk(a: Float, b: Float) = s.bo.any { it.first >= min(a, b) - w * .8f && it.first <= max(a, b) + w * .8f && it.second > .55f }
       for (f in s.fr.sortedByDescending { it.second }) if (!th(f.first) && !bk(m, f.first)) return f.first
       if (!th(m)) return m
       return (2..18).map { it * .05f }.sortedBy { abs(it - m) }.firstOrNull { !th(it) && !bk(m, it) }
      }

      fun tap(x: Float, y: Float) {
       val p = Path().apply { moveTo(x * F.w, y * F.h) }
       dispatchGesture(GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(p, 0, 50)).build(), null, null)
      }

      fun up(n: AccessibilityNodeInfo?): Boolean {
       var c = n; var i = 0
       while (c != null && i++ < 5) {
        if (c.isClickable) return c.performAction(AccessibilityNodeInfo.ACTION_CLICK)
        c = c.parent
       }
       return false
      }

      fun ck(r: AccessibilityNodeInfo, t: String): Boolean {
       for (n in r.findAccessibilityNodeInfosByText(t)) if (n.text?.toString()?.trim().equals(t, true)) return up(n)
       return false
      }

      fun cl(n: AccessibilityNodeInfo, d: Int): Boolean {
       if (d > 25) return false
       val s = n.contentDescription?.toString()?.lowercase() ?: ""
       val t = n.text?.toString()?.trim() ?: ""
       val id = n.viewIdResourceName?.lowercase() ?: ""
       if ((s.contains("close") || s.contains("dismiss") || id.contains("close") || t in listOf("X", "x", "✕", "×", "✖")) && up(n)) return true
       for (i in 0 until n.childCount) {
        val c = n.getChild(i) ?: continue
        if (cl(c, d + 1)) return true
       }
       return false
      }
     }
     E
     sed -i "s/com.your.game/$P/" src/main/java/A.kt
  - run: gradle assembleDebug --no-daemon -Dorg.gradle.jvmargs=-Xmx2g
  - uses: actions/upload-artifact@v4
    with: {name: apk, path: build/outputs/apk/debug/*.apk}
